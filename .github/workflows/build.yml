name: build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        - os: ubuntu-latest
          platform: linux
          portaudio: |
            sudo apt-get update
            sudo apt-get install -y portaudio19-dev
        - os: macos-latest
          platform: macos
          portaudio: |
            brew install portaudio
        - os: windows-latest
          platform: windows
          portaudio: ""

    runs-on: ${{ matrix.os }}

    env:
      # Node version used both by CI (setup-node) and by the runtime that we
      # bundle into the binary. Keep in sync with the Clear SDK's requirements.
      NODE_VERSION: "22.17.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install system dependencies
        if: matrix.portaudio != ''
        shell: bash
        run: ${{ matrix.portaudio }}

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          source .venv/bin/activate 2>/dev/null || .venv\Scripts\activate
          python -m pip install --upgrade pip
          python -m pip install -e .
        shell: bash

      - name: Bundle Node runtime
        # Download the official Node distribution and place its binary at
        # pamt/node/node/bin/node[.exe] so the app works on machines without
        # Node installed. PyInstaller's --collect-all pamt carries it into
        # the onefile.
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            linux)   node_arch=x64  ;;
            macos)   node_arch=arm64 ;;
            windows) node_arch=x64  ;;
          esac
          url="https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-${{ matrix.platform }}-${node_arch}.tar.gz"
          echo "Downloading $url"
          curl -fsSL "$url" -o /tmp/node.tar.gz
          mkdir -p pamt/node/node
          tar -xzf /tmp/node.tar.gz -C pamt/node/node --strip-components=1
          rm /tmp/node.tar.gz
          pamt/node/node/bin/node${{ matrix.platform == 'windows' && '.exe' || '' }} --version

      - name: Install Clear SDK
        run: node setup.js

      - name: Verify SDK
        run: node pamt/node/run.js --verify

      - name: Build with PyInstaller
        run: |
          source .venv/bin/activate 2>/dev/null || .venv\Scripts\activate
          pyinstaller --name pamt \
            --onefile \
            --clean \
            --collect-all pamt \
            launcher.py
        shell: bash

      - name: Smoke test the built binary
        # The binary must be able to locate the bundled node runtime and the
        # Clear SDK. We can't run the GUI headlessly, but we can verify the
        # node child-process path end-to-end by invoking the clean module
        # directly with the same lookup logic the binary uses.
        run: |
          source .venv/bin/activate 2>/dev/null || .venv\Scripts\activate
          python -c "
          from pamt import clean
          node = clean.node_binary()
          assert node, 'node_binary() returned None -- bundled node not found'
          print('node binary:', node)
          print('sdk ready:', clean._sdk_ready())
          assert clean._sdk_ready(), 'Clear SDK not bundled'
          "
        shell: bash

      - name: Package binary
        run: |
          mkdir -p dist
          version=$(cat .version)
          case "${{ matrix.platform }}" in
            linux)
              mv dist/pamt dist/pamt-${{ matrix.platform }}
              chmod +x dist/pamt-${{ matrix.platform }}
              tar -czf dist/pamt-${version}-${{ matrix.platform }}.tar.gz -C dist pamt-${{ matrix.platform }}
              rm dist/pamt-${{ matrix.platform }}
              ;;
            macos)
              mv dist/pamt dist/pamt-${{ matrix.platform }}
              chmod +x dist/pamt-${{ matrix.platform }}
              tar -czf dist/pamt-${version}-${{ matrix.platform }}.tar.gz -C dist pamt-${{ matrix.platform }}
              rm dist/pamt-${{ matrix.platform }}
              ;;
            windows)
              # Rename the exe before zipping so the archive contains a clean name.
              mv dist/pamt.exe "dist/pamt-${{ matrix.platform }}.exe"
              powershell -Command "Compress-Archive -Path 'dist/pamt-${{ matrix.platform }}.exe' -DestinationPath 'dist/pamt-${version}-${{ matrix.platform }}.zip'"
              rm "dist/pamt-${{ matrix.platform }}.exe"
              ;;
          esac
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pamt-${{ matrix.platform }}
          path: dist/pamt-*.tar.gz
          if-no-files-found: error

      - name: Upload Windows artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: pamt-${{ matrix.platform }}
          path: dist/pamt-*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip

  # Rolling "dev" channel: on every push to main (that isn't a tag), publish
  # the three platform binaries as a single pre-release named "dev-latest"
  # that is REPLACED in place each time. This gives a continuously-updated
  # binary to grab for testing without cutting a real release or polluting
  # the release history.
  dev:
    needs: build
    if: github.ref == 'refs/heads/main' && !startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish rolling dev pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: "dev-latest (main @ ${{ github.sha }})"
          body: |
            Rolling build from `main` — always the latest committed code,
            replaced in place on every push. Not a stable release; grab it
            to test current changes. Stable releases are tagged `v*`.

            Built from commit `${{ github.sha }}`.
          prerelease: true
          make_latest: false
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
