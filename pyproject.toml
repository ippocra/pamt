[project]
name = "pamt"
version = "0.1.0"
description = "Private Annotator Meeting Transcriber - local meeting recorder (mic + system audio)"
requires-python = ">=3.10"
dependencies = [
    "PyAudio>=0.2.13",
    "pystray>=0.19.5",
    "Pillow>=10.0",
    "pynput>=1.7.6",
    "pyobjc>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
pamt = "pamt.app:main"
