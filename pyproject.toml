[project]
name = "pamt"
description = "Private Annotator Meeting Transcriber - local meeting recorder (mic + system audio)"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "PyAudio>=0.2.13",
    "Pillow>=10.0",
    "pynput>=1.7.6",
    "platformdirs>=4.0",
    "pyobjc>=10.0; sys_platform == 'darwin'",
]
# NOTE: pystray (system-tray icon) is imported lazily by pamt.app so that a
# Python missing tkinter fails with a clear, actionable message instead of
# an opaque ImportError. Install it for a full experience:  pip install pystray

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { file = ".version" }

[tool.setuptools.packages.find]
include = ["pamt*"]

[tool.setuptools.package-data]
pamt = [
    "assets/*.png",
    "assets/*.svg",
    "node/clean.js",
    "node/run.js",
    "node/package.json",
    # Clear SDK (installed by `node setup.js`); shipped in the wheel/binary
    # so clean audio works out of the box.
    "node/node_modules/**/*",
]

[project.scripts]
pamt = "pamt.app:main"
